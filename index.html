<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>MovieBox Pro</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0b0b0e;
      color: #ffffff;
      padding-bottom: 40px;
      overflow-x: hidden;
    }

    /* Splash Screen */
    #splashScreen {
      position: fixed;
      inset: 0;
      background: #08080a;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: opacity 0.6s ease;
    }

    .splash-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 30px;
    }

    .splash-icon {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #e50914 0%, #b20710 100%);
      border-radius: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 35px rgba(229, 9, 20, 0.7);
      margin-bottom: 16px;
    }

    .splash-icon svg {
      width: 44px;
      height: 44px;
      fill: #ffffff;
    }

    .splash-text {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 0.5px;
      color: #fff;
    }

    .splash-text span {
      color: #e50914;
    }

    .splash-loader {
      width: 36px;
      height: 36px;
      border: 3.5px solid rgba(255, 255, 255, 0.1);
      border-top: 3.5px solid #e50914;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      background: rgba(11, 11, 14, 0.95);
      backdrop-filter: blur(12px);
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .app-title {
      font-size: 20px;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .app-title span {
      color: #e50914;
    }

    /* Search */
    .search-container {
      padding: 12px 18px;
    }

    .search-bar {
      width: 100%;
      padding: 12px 16px;
      background: #171720;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .search-bar:focus {
      border-color: #e50914;
    }

    /* Grid */
    .container {
      padding: 6px 18px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 14px;
      color: #e2e2e8;
    }

    .movie-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .movie-card {
      background: #15151e;
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(255, 255, 255, 0.05);
      position: relative;
      transition: transform 0.2s;
    }

    .movie-card:active {
      transform: scale(0.97);
    }

    .poster-box {
      width: 100%;
      aspect-ratio: 2 / 3;
      background: #1f1f2b;
      overflow: hidden;
      position: relative;
    }

    .poster-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .badge-trending {
      position: absolute;
      top: 8px;
      left: 8px;
      background: #ff3838;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 3px 7px;
      border-radius: 6px;
      text-transform: uppercase;
      box-shadow: 0 2px 8px rgba(0,0,0,0.6);
    }

    .badge-series {
      position: absolute;
      top: 8px;
      right: 8px;
      background: #e50914;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 3px 7px;
      border-radius: 6px;
      text-transform: uppercase;
    }

    .movie-info {
      padding: 10px;
    }

    .movie-name {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #fff;
    }

    .movie-category {
      font-size: 11px;
      color: #8c8c9e;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Player Modal */
    #playerModal {
      position: fixed;
      inset: 0;
      background: #0b0b0e;
      z-index: 10000;
      display: none;
      flex-direction: column;
      overflow-y: auto;
    }

    .modal-header {
      position: relative;
      width: 100%;
      background: #000;
    }

    .close-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      cursor: pointer;
      z-index: 10001;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .player-wrapper {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
    }

    .player-wrapper iframe,
    .player-wrapper video {
      width: 100%;
      height: 100%;
      border: none;
    }

    .modal-body {
      padding: 16px;
    }

    .current-playing-title {
      font-size: 18px;
      font-weight: 700;
      color: #fff;
    }

    .current-playing-cat {
      font-size: 12px;
      color: #8c8c9e;
      margin-top: 3px;
      margin-bottom: 16px;
    }

    .episodes-section {
      margin-top: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 14px;
    }

    .episodes-title {
      font-size: 14px;
      font-weight: 600;
      color: #e50914;
      margin-bottom: 12px;
    }

    .episodes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 10px;
    }

    .ep-btn {
      background: #171720;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px 8px;
      border-radius: 10px;
      color: #fff;
      font-size: 12px;
      cursor: pointer;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: all 0.2s;
    }

    .ep-btn.active {
      background: #e50914;
      border-color: #e50914;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <!-- Permanent Built-in Splash Screen -->
  <div id="splashScreen">
    <div class="splash-brand">
      <div class="splash-icon">
        <svg viewBox="0 0 24 24">
          <path d="M4 6.47v11.06c0 1.55 1.7 2.51 3.03 1.72l9.22-5.53c1.3-.78 1.3-2.66 0-3.44L7.03 4.75C5.7 3.96 4 4.92 4 6.47z"/>
        </svg>
      </div>
      <div class="splash-text">MovieBox <span>Pro</span></div>
    </div>
    <div class="splash-loader"></div>
  </div>

  <header>
    <div class="app-title">MovieBox <span>Pro</span></div>
  </header>

  <div class="search-container">
    <input type="text" id="searchInput" class="search-bar" placeholder="Search movies or series...">
  </div>

  <div class="container">
    <div class="section-title">All Movies & Series</div>
    <div class="movie-grid" id="movieGrid"></div>
  </div>

  <!-- Player Modal -->
  <div id="playerModal">
    <div class="modal-header">
      <div class="close-btn" onclick="closePlayer()">✕</div>
      <div class="player-wrapper" id="playerHolder"></div>
    </div>
    <div class="modal-body">
      <div class="current-playing-title" id="modalTitle"></div>
      <div class="current-playing-cat" id="modalCat"></div>
      
      <div class="episodes-section" id="episodesBox" style="display:none;">
        <div class="episodes-title">Select Episode</div>
        <div class="episodes-grid" id="episodesList"></div>
      </div>
    </div>
  </div>

  <script>
    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1guQHHO214B_RbSoViKNpPaZ3MuS3bshw_FVbXTz4cbg/export?format=csv";
    
    let groupedData = [];

    // Splash animation
    setTimeout(() => {
      const splash = document.getElementById('splashScreen');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(() => splash.style.display = 'none', 600);
      }
    }, 2200);

    function parseCSV(text) {
      const lines = text.split('\n').filter(l => l.trim().length > 0);
      const rows = [];
      for (let i = 0; i < lines.length; i++) {
        let line = lines[i];
        let values = [];
        let curr = '';
        let insideQuote = false;
        for (let j = 0; j < line.length; j++) {
          let char = line[j];
          if (char === '"') {
            insideQuote = !insideQuote;
          } else if (char === ',' && !insideQuote) {
            values.push(curr.trim());
            curr = '';
          } else {
            curr += char;
          }
        }
        values.push(curr.trim());
        rows.push(values);
      }
      return rows;
    }

    async function loadData() {
      try {
        const res = await fetch(SHEET_CSV_URL);
        const data = await res.text();
        const rows = parseCSV(data);

        const seriesMap = new Map();

        rows.forEach(cols => {
          const rawTitle = cols[0] || '';
          if (!rawTitle || rawTitle.toLowerCase() === 'title') return;

          const poster = cols[1] || '';
          let link = cols[2] || '';
          const category = cols[3] || 'Movie';
          const epNum = cols[4] || '';
          const trendingVal = (cols[5] || '').toLowerCase();
          const isTrending = trendingVal.includes('yes') || trendingVal.includes('true') || category.toLowerCase().includes('trending');

          if (link.includes('youtu.be/')) {
            const vidId = link.split('youtu.be/')[1]?.split('?')[0];
            link = `https://www.youtube.com/embed/${vidId}`;
          } else if (link.includes('youtube.com/watch?v=')) {
            const vidId = link.split('v=')[1]?.split('&')[0];
            link = `https://www.youtube.com/embed/${vidId}`;
          }

          let mainTitle = rawTitle.trim();
          let epLabel = epNum ? epNum.trim() : '';

          if (!seriesMap.has(mainTitle)) {
            seriesMap.set(mainTitle, {
              title: mainTitle,
              category: category,
              poster: poster,
              isTrending: isTrending,
              isSeries: !!epLabel || category.toLowerCase().includes('series'),
              episodes: []
            });
          }

          const current = seriesMap.get(mainTitle);
          if (link) {
            current.episodes.push({
              label: epLabel || `Part ${current.episodes.length + 1}`,
              link: link
            });
          }
          if (poster && (!current.poster || current.poster.includes('placeholder'))) {
            current.poster = poster;
          }
          if (isTrending) {
            current.isTrending = true;
          }
        });

        groupedData = Array.from(seriesMap.values());
        renderGrid(groupedData);
      } catch (err) {
        console.error("Sheet Error:", err);
      }
    }

    function renderGrid(list) {
      const grid = document.getElementById('movieGrid');
      grid.innerHTML = '';

      list.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'movie-card';
        card.onclick = () => openItem(index);

        card.innerHTML = `
          <div class="poster-box">
            <img src="${item.poster || 'https://via.placeholder.com/300x450'}" alt="${item.title}" onerror="this.src='https://via.placeholder.com/300x450'">
            ${item.isTrending ? `<div class="badge-trending">🔥 Hot</div>` : ''}
            ${item.isSeries ? `<div class="badge-series">Series</div>` : ''}
          </div>
          <div class="movie-info">
            <div class="movie-name">${item.title}</div>
            <div class="movie-category">${item.category}</div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function openItem(index) {
      const item = groupedData[index];
      if (!item || !item.episodes.length) return;

      document.getElementById('modalTitle').innerText = item.title;
      document.getElementById('modalCat').innerText = item.category;

      const epBox = document.getElementById('episodesBox');
      const epList = document.getElementById('episodesList');
      epList.innerHTML = '';

      if (item.episodes.length > 1 || item.isSeries) {
        epBox.style.display = 'block';
        item.episodes.forEach((ep, i) => {
          const btn = document.createElement('div');
          btn.className = `ep-btn ${i === 0 ? 'active' : ''}`;
          btn.innerText = ep.label;
          btn.onclick = () => {
            document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            embedVideo(ep.link);
          };
          epList.appendChild(btn);
        });
      } else {
        epBox.style.display = 'none';
      }

      embedVideo(item.episodes[0].link);
      document.getElementById('playerModal').style.display = 'flex';
    }

    // Updated Smart Player Function
    function embedVideo(url) {
      const holder = document.getElementById('playerHolder');
      holder.innerHTML = '';
      if (!url) return;

      if (url.includes('.mp4') || url.includes('.mkv')) {
        holder.innerHTML = `<video controls autoplay playsinline style="width:100%; height:100%;"><source src="${url}" type="video/mp4"></video>`;
      } else {
        holder.innerHTML = `
          <iframe 
            src="${url}" 
            style="width: 100%; height: 100%; border: none;"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
            allowfullscreen 
            scrolling="no">
          </iframe>
        `;
      }
    }

    function closePlayer() {
      const modal = document.getElementById('playerModal');
      const holder = document.getElementById('playerHolder');
      holder.innerHTML = '';
      modal.style.display = 'none';
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase();
      renderGrid(groupedData.filter(m => m.title.toLowerCase().includes(q)));
    });

    loadData();
  </script>
</body>
</html>

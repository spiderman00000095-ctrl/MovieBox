<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>MovieBox Pro</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0d0d11;
      color: #ffffff;
      padding-bottom: 30px;
      overflow-x: hidden;
    }

    /* Splash Screen */
    #splashScreen {
      position: fixed;
      inset: 0;
      background: #08080a;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: opacity 0.5s ease;
    }

    .splash-logo-img {
      width: 70%;
      max-width: 260px;
      height: auto;
      border-radius: 20px;
      margin-bottom: 20px;
      filter: drop-shadow(0 0 25px rgba(229, 9, 20, 0.6));
    }

    .splash-loader {
      width: 35px;
      height: 35px;
      border: 3.5px solid rgba(255, 255, 255, 0.1);
      border-top: 3.5px solid #e50914;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* App Header */
    header {
      position: sticky;
      top: 0;
      background: rgba(13, 13, 17, 0.95);
      backdrop-filter: blur(10px);
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .app-title {
      font-size: 20px;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .app-title span {
      color: #e50914;
    }

    /* Search Box */
    .search-container {
      padding: 12px 18px;
    }

    .search-bar {
      width: 100%;
      padding: 12px 16px;
      background: #181822;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .search-bar:focus {
      border-color: #e50914;
    }

    /* Movie Grid */
    .container {
      padding: 6px 18px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 14px;
      color: #e2e2e8;
    }

    .movie-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .movie-card {
      background: #16161f;
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: transform 0.2s ease;
    }

    .movie-card:active {
      transform: scale(0.97);
    }

    .poster-box {
      width: 100%;
      aspect-ratio: 2 / 3;
      background: #20202c;
      overflow: hidden;
      position: relative;
    }

    .poster-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .movie-info {
      padding: 10px;
    }

    .movie-name {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #fff;
    }

    .movie-category {
      font-size: 11px;
      color: #8c8c9e;
      margin-top: 2px;
    }

    /* Video Player Modal */
    #playerModal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.95);
      z-index: 10000;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .close-btn {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      cursor: pointer;
      z-index: 10001;
    }

    .player-wrapper {
      width: 100%;
      max-width: 800px;
      aspect-ratio: 16 / 9;
      background: #000;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .player-wrapper iframe,
    .player-wrapper video {
      width: 100%;
      height: 100%;
      border: none;
      outline: none;
    }
  </style>
</head>
<body>

  <!-- Splash Screen -->
  <div id="splashScreen">
    <img src="https://images2.imgbox.com/f0/fb/zK1p0Sfe_o.png" class="splash-logo-img" alt="MovieBox Logo">
    <div class="splash-loader"></div>
  </div>

  <!-- Header -->
  <header>
    <div class="app-title">MovieBox <span>Pro</span></div>
  </header>

  <!-- Search -->
  <div class="search-container">
    <input type="text" id="searchInput" class="search-bar" placeholder="Search movies or series...">
  </div>

  <!-- Content -->
  <div class="container">
    <div class="section-title">All Content</div>
    <div class="movie-grid" id="movieGrid">
      <!-- Cards load automatically from sheet -->
    </div>
  </div>

  <!-- Universal Auto Player Modal -->
  <div id="playerModal">
    <div class="close-btn" onclick="closePlayer()">✕</div>
    <div class="player-wrapper" id="playerHolder">
      <!-- Iframe / Video dynamically injects here -->
    </div>
  </div>

  <script>
    // Sheet CSV Link: Apni Google Sheet ka published CSV link yahan paste karein
    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1guQHHO214B_RbSoViKNpPaZ3MuS3bshw_FVbXTz4cbg/export?format=csv";
    

    let allMovies = [];

    // Hide Splash Screen after loading
    window.addEventListener('load', () => {
      setTimeout(() => {
        const splash = document.getElementById('splashScreen');
        splash.style.opacity = '0';
        setTimeout(() => splash.style.display = 'none', 500);
      }, 1000);
    });

    // Fetch movies from Google Sheet
    async function loadMovies() {
      try {
        const res = await fetch(SHEET_CSV_URL);
        const data = await res.text();
        const rows = data.split('\n').slice(1); // Pehli header row chhodkar

        allMovies = rows.map(row => {
          const cols = row.split(',');
          return {
            title: cols[0]?.trim() || 'Untitled',
            category: cols[1]?.trim() || 'Movie',
            poster: cols[2]?.trim() || '',
            link: cols[3]?.trim() || ''
          };
        }).filter(m => m.title && m.link);

        renderMovies(allMovies);
      } catch (err) {
        console.error("Sheet load error: ", err);
      }
    }

    function renderMovies(movies) {
      const grid = document.getElementById('movieGrid');
      grid.innerHTML = '';

      movies.forEach(item => {
        const card = document.createElement('div');
        card.className = 'movie-card';
        card.onclick = () => playMedia(item.link);

        card.innerHTML = `
          <div class="poster-box">
            <img src="${item.poster || 'https://via.placeholder.com/300x450'}" alt="${item.title}" loading="lazy">
          </div>
          <div class="movie-info">
            <div class="movie-name">${item.title}</div>
            <div class="movie-category">${item.category}</div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Smart Player Logic (Handles both raw MP4 & Embed Links)
    function playMedia(url) {
      const modal = document.getElementById('playerModal');
      const holder = document.getElementById('playerHolder');
      holder.innerHTML = '';

      if (url.includes('.mp4') || url.includes('.mkv')) {
        // Direct MP4 Video Tag
        holder.innerHTML = `
          <video controls autoplay playsinline style="width:100%; height:100%;">
            <source src="${url}" type="video/mp4">
          </video>
        `;
      } else {
        // Embed Player (VidSrc, MultiEmbed, AutoEmbed, etc.)
        holder.innerHTML = `
          <iframe 
            src="${url}" 
            allow="autoplay; encrypted-media; fullscreen" 
            allowfullscreen 
            scrolling="no">
          </iframe>
        `;
      }

      modal.style.display = 'flex';
    }

    function closePlayer() {
      const modal = document.getElementById('playerModal');
      const holder = document.getElementById('playerHolder');
      holder.innerHTML = ''; // Video stop karne ke liye
      modal.style.display = 'none';
    }

    // Search Filter
    document.getElementById('searchInput').addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase();
      const filtered = allMovies.filter(m => m.title.toLowerCase().includes(query));
      renderMovies(filtered);
    });

    // Start fetching
    loadMovies();
  </script>
</body>
</html>
